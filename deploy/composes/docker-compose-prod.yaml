services:
  gateway:
    container_name: gateway
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    restart: unless-stopped
    depends_on:
      - client

  redis:
    container_name: redisAtlas
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

#  tasks:
#    container_name: task_service
#    build:
#      context: ../../tasks
#      dockerfile: Dockerfile
#    ports:
#      - "3002:3002"
#    restart: unless-stopped
#    depends_on:
#      - gateway

  auth:
    container_name: auth_service
    build:
      context: ../../auth
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - gateway
      - redis
    volumes:
      - ../../certs/jwt/private.pem:/run/certs/jwt/private.pem:ro
    environment:
      DB_HOST: host.lima.internal
      DB_PORT: 5432
      DB_NAME: atlas_users
      user: ${user}
      password: ${password}
      secret: ${secret}
      JWT_PRIVATE_KEY_PATH: /run/certs/jwt/private.pem

  client:
    container_name: frontend
    build:
      context: ../../client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  redis_data:
